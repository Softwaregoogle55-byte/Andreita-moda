<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andreita Moda - Admin</title>
    <style>
        :root {
            --rosa: #e91e63;
            --azul: #2196F3;
            --fondo: #f0f2f5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* ========== LOGIN ========== */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            text-align: center;
            width: 100%;
            max-width: 420px;
        }

        .login-box .logo-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fce4ec;
            margin-bottom: 15px;
        }

        .login-box h1 {
            font-size: 1.8em;
            background: linear-gradient(135deg, #667eea, #e91e63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .login-box h2 {
            color: #888;
            font-weight: 500;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .login-box input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 15px;
            transition: 0.3s;
        }

        .login-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
        }

        .error-msg {
            color: #e74c3c;
            margin-top: 12px;
            display: none;
            font-size: 0.9em;
        }

        /* ========== PANEL ========== */
        .admin-panel {
            background: var(--fondo);
            min-height: 100vh;
        }

        header {
            background: white;
            padding: 12px 30px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fce4ec;
        }

        header h1 {
            font-size: 1.2em;
            color: #333;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .notification-bell {
            position: relative;
            cursor: pointer;
            font-size: 1.5em;
            transition: 0.3s;
        }

        .notification-bell:hover { transform: scale(1.1); }

        .notification-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.5em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification-badge:empty { display: none; }

        .btn-logout {
            padding: 10px 22px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-logout:hover { background: #c0392b; }

        /* ========== TABS ========== */
        .tabs {
            display: flex;
            gap: 5px;
            padding: 20px 30px 0;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 22px;
            background: rgba(255,255,255,0.5);
            border: none;
            border-radius: 12px 12px 0 0;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: 0.3s;
        }

        .tab-btn.active { background: white; color: #667eea; }
        .tab-btn:hover { background: white; }

        /* ========== CONTENEDOR ========== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .card h2 {
            margin-bottom: 25px;
            color: #333;
            font-size: 1.2em;
        }

        /* ========== FORMULARIO ========== */
        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 600;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-primary {
            padding: 13px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.3);
        }

        .btn-secondary {
            padding: 13px 30px;
            background: #95a5a6;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-secondary:hover { background: #7f8c8d; }

        /* ========== GRID PRODUCTOS ========== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: #fafafa;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #eee;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .product-info { padding: 15px; }

        .product-info .cat-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .badge-damas { background: var(--rosa); }
        .badge-varones { background: var(--azul); }

        .product-info h3 {
            font-size: 0.9em;
            margin-bottom: 5px;
            color: #333;
        }

        .product-info .price {
            font-size: 1.2em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 10px;
        }

        .card-actions { display: flex; gap: 6px; }

        .card-actions button {
            flex: 1;
            padding: 7px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8em;
        }

        .btn-edit { background: #f39c12; color: white; }
        .btn-delete { background: #e74c3c; color: white; }

        /* ========== NOTIFICACIONES ========== */
        .notif-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .notif-item.no-leida { background: #f0f2ff; }
        .notif-item.leida { background: #fafafa; opacity: 0.7; }

        .notif-content .mensaje { font-size: 0.95em; color: #333; }
        .notif-content .fecha { font-size: 0.78em; color: #999; margin-top: 3px; }

        .btn-mark-all {
            padding: 8px 16px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85em;
        }

        /* ========== CONFIG QR ========== */
        .qr-preview img {
            max-width: 180px;
            border-radius: 10px;
            margin: 10px 0;
            border: 2px solid #eee;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; }
        }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .login-box { padding: 30px; }
            header h1 { font-size: 1em; }
            .tabs { padding: 15px 15px 0; }
        }
    </style>
</head>
<body>

    <!-- ==================== LOGIN ==================== -->
    <div id="loginSection" class="login-container">
        <div class="login-box">
            <img src="https://cdn.phototourl.com/free/2026-08-16-1600c8b6-d670-4973-a77c-d5a72c7d291e.png" alt="Andreita Moda" class="logo-img" onerror="this.style.display='none'">
            <h1>Andreita Moda</h1>
            <h2>Panel de Administración</h2>
            <input type="text" id="username" placeholder="👤 Usuario" autocomplete="off">
            <input type="password" id="password" placeholder="🔑 Contraseña">
            <button onclick="login()">Iniciar Sesión</button>
            <p id="loginError" class="error-msg"></p>
        </div>
    </div>

    <!-- ==================== PANEL ==================== -->
    <div id="adminPanel" class="admin-panel" style="display:none">
        <header>
            <div class="header-left">
                <img src="https://cdn.phototourl.com/free/2026-08-16-1600c8b6-d670-4973-a77c-d5a72c7d291e.png" alt="Logo" onerror="this.style.display='none'">
                <h1>Andreita Moda - Admin</h1>
            </div>
            <div class="header-right">
                <div class="notification-bell" onclick="cambiarTab('notificaciones')">
                    🔔<span id="notificationBadge" class="notification-badge"></span>
                </div>
                <button class="btn-logout" onclick="logout()">🚪 Salir</button>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="cambiarTab('productos')">📦 Productos</button>
            <button class="tab-btn" onclick="cambiarTab('notificaciones')">🔔 Notificaciones</button>
            <button class="tab-btn" onclick="cambiarTab('configuracion')">⚙️ Configuración</button>
        </div>

        <!-- PRODUCTOS -->
        <div id="tabProductos" class="container">
            <div class="card">
                <h2 id="formTitle">➕ Agregar Producto</h2>
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" id="nombre" required placeholder="Ej: Vestido Floral">
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="descripcion" rows="2" placeholder="Describe el producto..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Precio (Bs) *</label>
                        <input type="number" id="precio" step="0.01" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Categoría *</label>
                        <select id="categoria" required>
                            <option value="">Seleccionar</option>
                            <option value="damas">👩 Damas</option>
                            <option value="varones">👨 Varones</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Talla</label>
                        <select id="talla">
                            <option value="">Seleccionar</option>
                            <option value="XS">XS</option>
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                            <option value="XXL">XXL</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Color</label>
                        <input type="text" id="color" placeholder="Ej: Rojo, Azul...">
                    </div>
                </div>
                <div class="form-group">
                    <label>📷 Imagen</label>
                    <input type="file" id="imagen" accept="image/*">
                </div>
                <div class="form-actions">
                    <button class="btn-primary" onclick="guardarProducto()">💾 Guardar</button>
                    <button class="btn-secondary" onclick="limpiar()">🗑️ Limpiar</button>
                </div>
            </div>
            <div class="card">
                <h2>📦 Productos Publicados</h2>
                <div id="productsGrid" class="products-grid">
                    <p style="color:#999;text-align:center;grid-column:1/-1">Cargando...</p>
                </div>
            </div>
        </div>

        <!-- NOTIFICACIONES -->
        <div id="tabNotificaciones" class="container" style="display:none;grid-template-columns:1fr">
            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px">
                    <h2 style="margin:0">🔔 Notificaciones</h2>
                    <button class="btn-mark-all" onclick="marcarTodasLeidas()">✓ Marcar todas leídas</button>
                </div>
                <div id="notificationsList"><p style="color:#999;text-align:center">Cargando...</p></div>
            </div>
        </div>

        <!-- CONFIGURACIÓN -->
        <div id="tabConfiguracion" class="container" style="display:none;grid-template-columns:1fr">
            <div class="card">
                <h2>⚙️ Configuración de Pago QR</h2>
                <form id="configForm" enctype="multipart/form-data" style="max-width:550px">
                    <div class="form-group">
                        <label>📷 Imagen QR</label>
                        <div id="qrPreview" class="qr-preview"></div>
                        <input type="file" id="qr_imagen" accept="image/*">
                        <input type="hidden" id="qr_imagen_actual">
                    </div>
                    <div class="form-group">
                        <label>🏦 Banco</label>
                        <input type="text" id="banco_nombre" placeholder="Ej: Banco Nacional de Bolivia">
                    </div>
                    <div class="form-group">
                        <label>👤 Titular</label>
                        <input type="text" id="cuenta_titular" placeholder="Ej: Andreita Moda">
                    </div>
                    <div class="form-group">
                        <label>🔢 Número de cuenta</label>
                        <input type="text" id="numero_cuenta" placeholder="Ej: 123456789">
                    </div>
                    <div class="form-group">
                        <label>📱 WhatsApp</label>
                        <input type="text" id="whatsapp" placeholder="Ej: 59177262626">
                    </div>
                    <button type="submit" class="btn-primary">💾 Guardar Configuración</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ==================== SCRIPT ==================== -->
    <script>
        const API_URL = '/api';
        let currentId = null;

        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const err = document.getElementById('loginError');
            err.style.display = 'none';
            if (!u || !p) { err.textContent = '❌ Llena todos los campos'; err.style.display = 'block'; return; }
            try {
                const r = await fetch(API_URL + '/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                if (r.ok) {
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    cargarProductos();
                    setInterval(actualizarContador, 10000);
                } else {
                    err.textContent = '❌ Usuario o contraseña incorrectos';
                    err.style.display = 'block';
                }
            } catch (e) {
                err.textContent = '❌ Error de conexión';
                err.style.display = 'block';
            }
        }

        function logout() {
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('adminPanel').style.display = 'none';
        }

        function cambiarTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tabProductos').style.display = 'none';
            document.getElementById('tabNotificaciones').style.display = 'none';
            document.getElementById('tabConfiguracion').style.display = 'none';

            if (tab === 'productos') {
                document.getElementById('tabProductos').style.display = 'grid';
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                cargarProductos();
            } else if (tab === 'notificaciones') {
                document.getElementById('tabNotificaciones').style.display = 'grid';
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                cargarNotificaciones();
            } else if (tab === 'configuracion') {
                document.getElementById('tabConfiguracion').style.display = 'grid';
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                cargarConfiguracion();
            }
        }

        async function cargarProductos() {
            try {
                const r = await fetch(API_URL + '/productos');
                const p = await r.json();
                const g = document.getElementById('productsGrid');
                if (!p.length) { g.innerHTML = '<p style="color:#999;text-align:center;grid-column:1/-1">📭 Sin productos</p>'; return; }
                g.innerHTML = p.map(x => {
                    const catClass = x.categoria === 'damas' ? 'badge-damas' : 'badge-varones';
                    return `
                    <div class="product-card">
                        ${x.imagen ? `<img src="/uploads/${x.imagen}" alt="${x.nombre}">` : '<div style="height:150px;background:#eee;display:flex;align-items:center;justify-content:center;color:#999">Sin img</div>'}
                        <div class="product-info">
                            <span class="cat-badge ${catClass}">${x.categoria||'General'}</span>
                            <h3>${x.nombre}</h3>
                            <p class="price">Bs ${parseFloat(x.precio).toFixed(2)}</p>
                            <div class="card-actions">
                                <button class="btn-edit" onclick="editar(${x.id})">✏️</button>
                                <button class="btn-delete" onclick="eliminar(${x.id})">🗑️</button>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) {}
        }

        async function guardarProducto() {
            const f = new FormData();
            f.append('nombre', document.getElementById('nombre').value);
            f.append('descripcion', document.getElementById('descripcion').value);
            f.append('precio', document.getElementById('precio').value);
            f.append('categoria', document.getElementById('categoria').value);
            f.append('talla', document.getElementById('talla').value);
            f.append('color', document.getElementById('color').value);
            const img = document.getElementById('imagen').files[0];
            if (img) f.append('imagen', img);
            const url = currentId ? API_URL + '/productos/' + currentId : API_URL + '/productos';
            const method = currentId ? 'PUT' : 'POST';
            try {
                await fetch(url, { method, body: f });
                alert('✅ Guardado');
                limpiar();
                cargarProductos();
            } catch (e) { alert('❌ Error'); }
        }

        async function editar(id) {
            try {
                const r = await fetch(API_URL + '/productos/' + id);
                const p = await r.json();
                document.getElementById('formTitle').textContent = '✏️ Editar Producto';
                document.getElementById('productId').value = p.id;
                document.getElementById('nombre').value = p.nombre;
                document.getElementById('descripcion').value = p.descripcion || '';
                document.getElementById('precio').value = p.precio;
                document.getElementById('categoria').value = p.categoria || '';
                document.getElementById('talla').value = p.talla || '';
                document.getElementById('color').value = p.color || '';
                currentId = id;
                window.scrollTo({top:0,behavior:'smooth'});
            } catch (e) {}
        }

        async function eliminar(id) {
            if (!confirm('¿Eliminar?')) return;
            try { await fetch(API_URL + '/productos/' + id, { method: 'DELETE' }); alert('✅ Eliminado'); cargarProductos(); } catch (e) {}
        }

        function limpiar() {
            document.getElementById('productId').value = '';
            document.getElementById('formTitle').textContent = '➕ Agregar Producto';
            document.getElementById('nombre').value = '';
            document.getElementById('descripcion').value = '';
            document.getElementById('precio').value = '';
            document.getElementById('categoria').value = '';
            document.getElementById('talla').value = '';
            document.getElementById('color').value = '';
            document.getElementById('imagen').value = '';
            currentId = null;
        }

        async function cargarNotificaciones() {
            try {
                const r = await fetch(API_URL + '/notificaciones');
                const n = await r.json();
                const l = document.getElementById('notificationsList');
                if (!n.length) { l.innerHTML = '<p style="color:#999;text-align:center">📭 Sin notificaciones</p>'; return; }
                l.innerHTML = n.map(x => `
                    <div class="notif-item ${x.leido ? 'leida' : 'no-leida'}">
                        <div class="notif-content">
                            <p class="mensaje">${x.mensaje}</p>
                            <p class="fecha">📅 ${new Date(x.fecha).toLocaleString('es-BO')}</p>
                        </div>
                        <div style="display:flex;gap:8px">
                            ${!x.leido ? `<button style="background:#3498db;color:white;border:none;padding:6px 10px;border-radius:6px;cursor:pointer" onclick="marcarLeida(${x.id})">✓</button>` : ''}
                            <button style="background:#e74c3c;color:white;border:none;padding:6px 10px;border-radius:6px;cursor:pointer" onclick="eliminarNoti(${x.id})">🗑️</button>
                        </div>
                    </div>`).join('');
            } catch (e) {}
        }

        async function actualizarContador() {
            try {
                const r = await fetch(API_URL + '/notificaciones/no-leidas');
                const d = await r.json();
                document.getElementById('notificationBadge').textContent = d.total > 0 ? d.total : '';
            } catch (e) {}
        }

        async function marcarLeida(id) { await fetch(API_URL + '/notificaciones/' + id + '/leer', { method: 'PUT' }); cargarNotificaciones(); actualizarContador(); }
        async function marcarTodasLeidas() { await fetch(API_URL + '/notificaciones/leer-todas', { method: 'PUT' }); cargarNotificaciones(); actualizarContador(); }
        async function eliminarNoti(id) { if (confirm('¿Eliminar?')) { await fetch(API_URL + '/notificaciones/' + id, { method: 'DELETE' }); cargarNotificaciones(); actualizarContador(); } }

        async function cargarConfiguracion() {
            try {
                const r = await fetch(API_URL + '/configuracion');
                const c = await r.json();
                document.getElementById('qr_imagen_actual').value = c.qr_imagen || '';
                document.getElementById('banco_nombre').value = c.banco_nombre || '';
                document.getElementById('cuenta_titular').value = c.cuenta_titular || '';
                document.getElementById('numero_cuenta').value = c.numero_cuenta || '';
                document.getElementById('whatsapp').value = c.whatsapp || '';
                document.getElementById('qrPreview').innerHTML = c.qr_imagen ? `<img src="/uploads/${c.qr_imagen}" alt="QR">` : '<p style="color:#999">Sin QR</p>';
            } catch (e) {}
        }

        document.getElementById('configForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const f = new FormData();
            f.append('banco_nombre', document.getElementById('banco_nombre').value);
            f.append('cuenta_titular', document.getElementById('cuenta_titular').value);
            f.append('numero_cuenta', document.getElementById('numero_cuenta').value);
            f.append('whatsapp', document.getElementById('whatsapp').value);
            f.append('qr_imagen_actual', document.getElementById('qr_imagen_actual').value);
            const file = document.getElementById('qr_imagen').files[0];
            if (file) f.append('qr_imagen', file);
            try {
                await fetch(API_URL + '/configuracion', { method: 'PUT', body: f });
                alert('✅ Configuración guardada');
                cargarConfiguracion();
            } catch (e) { alert('❌ Error'); }
        });
    </script>
</body>
